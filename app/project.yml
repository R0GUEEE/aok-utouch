name: AokVM
options:
  bundleIdPrefix: com.aok
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_BITCODE: NO
    # The engine is GPLv2-or-later; the app links it statically.
    GCC_C_LANGUAGE_STANDARD: gnu11
    OTHER_LDFLAGS: -lc++ -lz
    HEADER_SEARCH_PATHS:
      - $(SRCROOT)/../engine/aok-ios
      - $(SRCROOT)/../build/qemu-headers/include
      - $(SRCROOT)/../build/qemu-headers
      - $(SRCROOT)/../build/qemu-ios
      - $(SRCROOT)/../build/ios-sysroot/include
      - $(SRCROOT)/../build/ios-sysroot/include/glib-2.0
      - $(SRCROOT)/../build/ios-sysroot/include/pixman-1
      - $(SRCROOT)/../build/ios-sysroot/lib/glib-2.0/include
    LIBRARY_SEARCH_PATHS:
      - $(SRCROOT)/../build/qemu-ios
      - $(SRCROOT)/../build/ios-sysroot/lib

targets:
  AokVM:
    type: application
    platform: iOS
    sources:
      - path: AokVM
      - path: ../engine/aok-ios/aok_ios.c
        name: engine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aok.vm
        PRODUCT_NAME: AokVM
        INFOPLIST_FILE: AokVM/Info.plist
        CODE_SIGN_ENTITLEMENTS: AokVM/AokVM.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: AokVM/Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        # QEMU's own headers and our glue are C99/C11 with GNU extensions.
        OTHER_CFLAGS: -Wno-everything -D_GNU_SOURCE -DHAVE_CONFIG_H
        OTHER_LDFLAGS:
          # The engine is a *flat* object list, not an archive, and it has to
          # stay flat: QEMU links stubs and real implementations together and
          # lets ld pick the first definition (system_cpus.c includes
          # stubs/iothread-lock.c for that reason). An archive would hand those
          # duplicates to ld's duplicate check, which rejects them.
          #
          # scripts/10-build-qemu-ios.sh writes the list; the objects must be
          # passed directly, so it is a response file, not -l or force_load.
          - -Wl,@$(SRCROOT)/../build/qemu-ios/engine-link-inputs.txt
          - -lglib-2.0
          - -lgthread-2.0
          - -lgobject-2.0
          - -lgio-2.0
          - -lgmodule-2.0
          - -lpixman-1
          - -lslirp
          # glib's own proxy-libintl (g_libintl_*), libffi for GObject closures,
          # and the resolver glib's threaded DNS and slirp's get_dns_addr use.
          - -lintl
          - -lffi
          - -lresolv
          - -liconv
          - -lz
          - -lc++
          - -framework Metal
          - -framework MetalKit
          - -framework CoreVideo
          - -framework IOSurface
          - -framework CoreFoundation
